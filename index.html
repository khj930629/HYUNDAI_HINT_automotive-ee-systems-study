    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return { ...defaultState, ...JSON.parse(saved) };
      } catch (e) {
        console.warn('저장된 학습 기록 로드 오류:', e);
      }
      return { ...defaultState };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        updateGlobalProgressUI();
      } catch (e) {
        console.warn('학습 기록 저장 실패:', e);
      }
    }

    function logActivity(text) {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      appState.recentActivities.unshift({ time: timeStr, text });
      if (appState.recentActivities.length > 15) appState.recentActivities.pop();
      saveState();
    }

      const box = document.getElementById('toastBox');

      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastMessage').textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 3200);
    }

    function initTheoryInteractions() {
      const tabs = document.querySelectorAll('.level-tab');
      const box = document.getElementById('levelContentBox');
      if (!tabs.length || !box) return;

      const idx = CURRICULUM.findIndex(c => c.id === appState.activeChapterId);
      const mod = CURRICULUM[idx >= 0 ? idx : 0];

      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          const lvl = btn.dataset.level;
          tabs.forEach(b => {
            b.className = b.dataset.level === lvl
              ? 'level-tab px-3 py-1.5 rounded-lg text-xs font-bold bg-hyundai-blue text-slate-950'
              : 'level-tab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white';
          });
          if (mod && mod.levels && mod.levels[lvl]) {
            box.textContent = mod.levels[lvl];
          }
        });
      });
    }

    window.selectTheoryComponent = function(idx) {
      const idxMod = CURRICULUM.findIndex(c => c.id === appState.activeChapterId);
      const mod = CURRICULUM[idxMod >= 0 ? idxMod : 0];
      if (mod && mod.components && mod.components[idx]) {
        const c = mod.components[idx];
        showToast(`[부품 탐색] ${c.name}: ${c.role}`, 'ℹ️');
      }
    };

    window.toggleChapterComplete = function(chId) {
      if (appState.completedChapters.includes(chId)) {
        appState.completedChapters = appState.completedChapters.filter(id => id !== chId);
        showToast('단원 완료 표시가 해제되었습니다.', 'ℹ️');
      } else {
        appState.completedChapters.push(chId);
        showToast('현재 단원을 학습 완료 처리했습니다!', '🎉');
        logActivity(`[단원 완료] ${chId}`);
      }
      saveState();
      renderCurrentRoute();
    };

    window.checkChapterQuiz = function(chId, oIdx) {
      const mod = CURRICULUM.find(c => c.id === chId);
      if (!mod) return;
      const q = mod.quiz;
      const feedback = document.getElementById('chapterQuizFeedback');
      const correct = oIdx === q.answer;

      feedback.classList.remove('hidden');
      feedback.className = correct
        ? 'p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed bg-emerald-500/15 border border-emerald-500/40 text-emerald-200'
        : 'p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed bg-rose-500/15 border border-rose-500/40 text-rose-200';
      feedback.innerHTML = correct
        ? `<strong>✅ 정답입니다!</strong><br/>${q.explanation}`
        : `<strong>❌ 오답입니다. (정답: ${q.options[q.answer]})</strong><br/>${q.explanation}`;

      if (!correct) {
        addWrongNote({
          id: chId,
          chapter: mod.chapter,
          q: q.q,
          userAns: q.options[oIdx],
          correctAns: q.options[q.answer],
          explanation: q.explanation
        });
      }
    };

    window.addWrongNote = function(item) {
      if (!appState.wrongNotes.some(n => n.q === item.q)) {
        appState.wrongNotes.push(item);
        saveState();
      }
    };

     *************************************************************************/
    let currentRandomExamSet = [];

    function pickRandomExamQuestions(count = 15) {
      const pool = [...EXAM_QUESTIONS];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      currentRandomExamSet = pool.slice(0, Math.min(count, pool.length));
      return currentRandomExamSet;
    }

    window.regenerateRandomExam = function() {
      pickRandomExamQuestions(15);
      renderCurrentRoute();
      showToast('전체 50문항 은행에서 새로운 15문항이 랜덤 출제되었습니다!', '🎲');
    };

    window.submitFullExam = function() {
      let correctCount = 0;
      let unanswered = 0;
      const totalCount = currentRandomExamSet.length;

      currentRandomExamSet.forEach((q, idx) => {
        const checked = document.querySelector(`input[name="exam_q_${idx}"]:checked`);
        const expBox = document.getElementById(`examExp_${idx}`);
        expBox.classList.remove('hidden');

        if (!checked) {
          unanswered++;
          expBox.className = 'p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed bg-amber-500/15 border border-amber-500/40 text-amber-200';
          expBox.innerHTML = `<strong>⚠️ 미응답 문항 (정답: ${q.options[q.answer]})</strong><br/>${q.explanation}`;
          return;
        }

        const userVal = parseInt(checked.value, 10);
        if (userVal === q.answer) {
          correctCount++;
          expBox.className = 'p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed bg-emerald-500/15 border border-emerald-500/40 text-emerald-200';
          expBox.innerHTML = `<strong>✅ 정답입니다!</strong><br/>${q.explanation}`;
        } else {
          expBox.className = 'p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed bg-rose-500/15 border border-rose-500/40 text-rose-200';
          expBox.innerHTML = `<strong>❌ 오답입니다. (선택: ${q.options[userVal]} / 정답: ${q.options[q.answer]})</strong><br/>${q.explanation}`;
          addWrongNote({
            id: q.id,
            chapter: q.chapter,
            q: q.q,
            userAns: q.options[userVal],
            correctAns: q.options[q.answer],
            explanation: q.explanation
          });
        }
      });

      const score = Math.round((correctCount / totalCount) * 100);
      appState.quizScores[`exam_${Date.now()}`] = score;
      logActivity(`[종합 평가 완료] 점수: ${score}점 (${correctCount}/${totalCount} 정답)`);
      saveState();

      const banner = document.getElementById('examResultBanner');
      banner.classList.remove('hidden');
      banner.className = score >= 80
        ? 'rounded-2xl p-6 border bg-emerald-500/15 border-emerald-500/40 text-emerald-200'

      banner.innerHTML = `

    }

    function renderGlossaryCards(list) {
      if (!list.length) {
        return `<div class="col-span-2 p-8 text-center text-slate-400 bg-hyundai-panel rounded-2xl border border-hyundai-border text-sm">검색 조건에 일치하는 용어가 없습니다.</div>`;
      }
      return list.map(item => `
        <div class="bg-hyundai-panel border border-hyundai-border hover:border-hyundai-blue/60 rounded-2xl p-5 space-y-2 transition">
          <div class="flex items-center justify-between gap-2">
            <span class="text-base font-extrabold text-hyundai-blue font-mono">${item.term}</span>
            <span class="px-2.5 py-0.5 rounded-full bg-hyundai-card text-sky-300 text-[11px] font-semibold border border-hyundai-border">${item.cat}</span>
          </div>
          <div class="text-xs font-semibold text-slate-400">${item.full}</div>
          <p class="text-xs sm:text-sm text-slate-200 leading-relaxed pt-1">${item.def}</p>
        </div>
      `).join('');
    }

    function initGlossaryInteractions() {
      const filter = () => {
        const kw = document.getElementById('glossarySearch').value.trim().toLowerCase();
        const cat = document.getElementById('glossaryCat').value;
        const filtered = GLOSSARY_ITEMS.filter(item => {
          const matchCat = cat === '전체' || item.cat === cat;
          const matchKw = !kw || item.term.toLowerCase().includes(kw) || item.full.toLowerCase().includes(kw) || item.def.toLowerCase().includes(kw);
          return matchCat && matchKw;
        });
        document.getElementById('glossaryGrid').innerHTML = renderGlossaryCards(filtered);
      };
      document.getElementById('glossarySearch').addEventListener('input', filter);
      document.getElementById('glossaryCat').addEventListener('change', filter);
    }

    /*************************************************************************
     * 11. VIEW 8: MY LEARNING RECORDS & WRONG ANSWER NOTES
     *************************************************************************/
    function renderRecords() {
      const incompleteChapters = CURRICULUM.filter(c => !appState.completedChapters.includes(c.id));

      return `
        <div class="space-y-6">
          <div class="bg-hyundai-panel border border-hyundai-border rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-white">🏆 나의 학습 기록 및 오답 노트</h1>
              <p class="text-xs sm:text-sm text-slate-300 mt-1">학습 진도, 평가 점수, 취약 개념 및 오답 노트는 브라우저에 자동 저장되어 새로고침 후에도 유지됩니다.</p>
            </div>
            <button onclick="resetAllProgress()" class="px-3.5 py-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/40 text-xs font-bold transition">
              학습 기록 초기화
            </button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-hyundai-panel border border-hyundai-border rounded-2xl p-6 space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold text-rose-400">📌 저장된 오답 노트 (${appState.wrongNotes.length}건)</h2>
              </div>
              ${appState.wrongNotes.length === 0
                ? '<div class="p-6 rounded-xl bg-hyundai-card text-center text-xs text-slate-400">현재 오답 노트에 저장된 문항이 없습니다. 완벽합니다!</div>'
                : `<div class="space-y-3">
                    ${appState.wrongNotes.map((n, i) => `
                      <div class="p-4 rounded-xl bg-hyundai-card border border-rose-500/30 space-y-2 text-xs">
                        <div class="flex items-center justify-between">
                          <span class="font-bold text-sky-300">${n.chapter}</span>
                          <button onclick="removeWrongNote(${i})" class="text-slate-400 hover:text-emerald-400 font-semibold">✓ 복습 완료(삭제)</button>
                        </div>
                        <div class="font-bold text-white text-sm">${n.q}</div>
                        <div class="text-rose-300">• 내가 고른 오답: ${n.userAns}</div>
                        <div class="text-emerald-300 font-semibold">• 정답: ${n.correctAns}</div>
                        <p class="text-slate-300 leading-relaxed pt-1 border-t border-hyundai-border">${n.explanation}</p>
                      </div>
                    `).join('')}
                  </div>`
              }
            </div>

            <div class="bg-hyundai-panel border border-hyundai-border rounded-2xl p-6 space-y-4">
              <h2 class="text-lg font-bold text-amber-400">🎯 복습이 필요한 취약 영역 (미완료 단원)</h2>
              ${incompleteChapters.length === 0
                ? '<div class="p-6 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-200 text-xs sm:text-sm font-bold">🎉 축하합니다! 전체 10개 강의를 모두 완료했습니다.</div>'
                : `<div class="space-y-2.5">
                    ${incompleteChapters.map(c => `
                      <div class="p-3.5 rounded-xl bg-hyundai-card border border-hyundai-border flex items-center justify-between gap-3">
                        <div>
                          <div class="text-xs font-mono text-sky-400">${c.chapter}</div>
                          <div class="text-sm font-bold text-white">${c.title}</div>
                        </div>
                        <button onclick="navigate('theory', '${c.id}')" class="px-3 py-1.5 rounded-lg bg-hyundai-blue text-slate-950 font-bold text-xs shrink-0">학습하기</button>
                      </div>
                    `).join('')}
                  </div>`
              }
            </div>
          </div>
        </div>
      `;
    }

    window.removeWrongNote = function(idx) {
      appState.wrongNotes.splice(idx, 1);
      saveState();
      renderCurrentRoute();
      showToast('오답 노트 항목을 복습 완료 처리했습니다.');
    };

    window.resetAllProgress = function() {
      appState = { ...defaultState, completedChapters: [], quizScores: {}, wrongNotes: [], recentActivities: [{ time: '방금 전', text: '학습 기록이 초기화되었습니다.' }] };
      saveState();
      renderCurrentRoute();
      showToast('모든 학습 기록이 초기화되었습니다.', '🔄');
    };

    /*************************************************************************
     * 12. INITIAL BOOTSTRAP
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      updateGlobalProgressUI();
      navigate(appState.currentRoute || 'dashboard');
    });
  </script>
</body>
</html>
